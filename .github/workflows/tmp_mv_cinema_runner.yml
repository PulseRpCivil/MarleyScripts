name: Temporary mv_cinema builder
on:
  pull_request:
    branches: [main]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack uploaded resource
        shell: bash
        run: |
          set -euxo pipefail
          unzip -t source.zip
          rm -rf unpacked
          mkdir unpacked
          unzip -q source.zip -d unpacked
          find unpacked -maxdepth 6 -type f -print
      - name: Inspect player and audio code
        shell: bash
        run: |
          set -euxo pipefail
          ROOT='unpacked/mv_cinema'
          test -d "$ROOT"
          echo '=== FXMANIFEST ==='
          cat "$ROOT/fxmanifest.lua"
          echo '=== AUDIO REFERENCES ==='
          grep -RniE 'audio|volume|mute|unMute|setVolume|YT\.Player|youtube|Dui|SendDuiMessage|interior|insideMlo|insideMLO' "$ROOT" --include='*.lua' --include='*.js' --include='*.html' || true
          echo '=== CONTROL APP.JS ==='
          cat "$ROOT/html/control/app.js"
          echo '=== CLIENT MAIN.LUA ==='
          cat "$ROOT/client/main.lua"
