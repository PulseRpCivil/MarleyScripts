name: Temporary mv_cinema runner
on:
  pull_request:
    branches: [main]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Test Drive download endpoints
        shell: bash
        run: |
          set -u
          ID='1tseWbF5TDsQac1MCMs52lGcK4x0uS59S'
          urls=(
            "https://drive.usercontent.google.com/download?id=$ID&export=download&confirm=t"
            "https://drive.google.com/uc?export=download&id=$ID"
            "https://drive.google.com/uc?id=$ID&export=download"
            "https://drive.google.com/file/d/$ID/view?usp=drivesdk"
          )
          i=0
          for url in "${urls[@]}"; do
            i=$((i+1))
            echo "=== URL $i ==="
            curl -L -sS -D "headers_$i.txt" -A 'Mozilla/5.0' -o "body_$i.bin" "$url" || true
            cat "headers_$i.txt" || true
            ls -lh "body_$i.bin" || true
            file "body_$i.bin" || true
            head -c 1000 "body_$i.bin" | strings || true
            echo
            grep -Eo 'https?[^"<> ]+' "body_$i.bin" | head -20 || true
          done
