name: Temporary mv_cinema audio-fix builder
on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source
        shell: bash
        run: |
          set -euxo pipefail
          unzip -t source.zip
          rm -rf work dist
          mkdir -p work dist
          unzip -q source.zip -d work
          test -d work/mv_cinema
          cp -a work/mv_cinema dist/mv_cinema

      - name: Apply audio fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('dist/mv_cinema')
          client = root / 'client' / 'main.lua'
          manifest = root / 'fxmanifest.lua'

          text = client.read_text(encoding='utf-8')

          pattern = re.compile(
              r"local function remoteOptions\(screenData, url\)\n"
              r"\s*local state = screenData\.state or \{\}\n"
              r"\s*return \{",
              re.MULTILINE,
          )
          replacement = """local function remoteVolumePercent(screenData)
              return math.floor(clamp((screenData.currentVolume or 0.0) * 100.0, 0.0, 100.0) + 0.5)
          end

          local function remoteOptions(screenData, url)
              local state = screenData.state or {}
              local volume = remoteVolumePercent(screenData)
              return {"""
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('remoteOptions header was not found exactly once')

          text, count = re.subn(
              r"muted\s*=\s*false,\n\s*volume\s*=\s*100,",
              "muted = volume <= 0,\n            volume = volume,",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('remoteOptions muted/volume block was not found')

          old_volume = "math.floor(clamp((screenData.currentVolume or 0.0) * 100.0, 0.0, 100.0) + 0.5)"
          text = text.replace(old_volume, "remoteVolumePercent(screenData)")

          callback_marker = "RegisterNUICallback('init', function(data, cb)"
          callback_index = text.find(callback_marker)
          if callback_index < 0:
              callback_marker = 'RegisterNUICallback("init", function(data, cb)'
              callback_index = text.find(callback_marker)
          if callback_index < 0:
              raise SystemExit('init callback was not found')

          initialized_marker = 'screenData.playerInitialized = true'
          initialized_index = text.find(initialized_marker, callback_index)
          if initialized_index < 0:
              raise SystemExit('playerInitialized assignment was not found in init callback')
          initialized_end = initialized_index + len(initialized_marker)
          text = text[:initialized_end] + "\n        screenData.lastVolume = -1.0" + text[initialized_end:]

          sync_marker = 'syncRemoteDui(screenData, false)'
          sync_index = text.find(sync_marker, initialized_end)
          if sync_index < 0:
              raise SystemExit('initial syncRemoteDui call was not found')
          sync_end = sync_index + len(sync_marker)

          retry_block = r'''

              -- The remote PMMS/YouTube player can finish initializing after the
              -- first volume packet. Re-send the authoritative MLO volume for a
              -- few seconds so CEF cannot leave the player muted at startup.
              CreateThread(function()
                  for attempt = 1, 10 do
                      if not screenData.dui or not screenData.playerInitialized then
                          return
                      end

                      local state = screenData.state or {}
                      local url = mediaUrlFromState(state)
                      if url and state.status ~= 'stopped' then
                          local volume = remoteVolumePercent(screenData)
                          sendRawDui(screenData, {
                              type = 'update',
                              handle = screenData.mediaHandle,
                              options = remoteOptions(screenData, url),
                              distance = 0.0,
                              sameRoom = true,
                              muted = volume <= 0,
                              volume = volume
                          })
                      end

                      Wait(400)
                  end
              end)'''
          text = text[:sync_end] + retry_block + text[sync_end:]

          client.write_text(text, encoding='utf-8')

          manifest_text = manifest.read_text(encoding='utf-8')
          manifest_text = re.sub(r"version\s+['\"]1\.5\.7['\"]", "version '1.5.8'", manifest_text, count=1)
          manifest.write_text(manifest_text, encoding='utf-8')

          readme = root / 'README_RU.md'
          with readme.open('a', encoding='utf-8') as fh:
              fh.write("\n\n## 1.5.8 — исправление звука\n\n"
                       "- Громкость PMMS DUI задаётся уже в первом пакете и больше не стартует принудительно на 100%.\n"
                       "- Состояние mute зависит от фактической громкости внутри MLO.\n"
                       "- После инициализации плеера громкость и unmute повторно синхронизируются 10 раз.\n")
          PY

      - name: Validate package
        shell: bash
        run: |
          set -euxo pipefail
          test -f dist/mv_cinema/fxmanifest.lua
          test -f dist/mv_cinema/client/main.lua
          test -f dist/mv_cinema/server/main.lua
          test -f dist/mv_cinema/html/control/app.js
          grep -q "version '1.5.8'" dist/mv_cinema/fxmanifest.lua
          grep -q "remoteVolumePercent" dist/mv_cinema/client/main.lua
          grep -q "for attempt = 1, 10" dist/mv_cinema/client/main.lua
          node --check dist/mv_cinema/html/control/app.js
          if grep -Rni "RegisterCommand" dist/mv_cinema --include='*.lua'; then
            echo 'Slash commands found unexpectedly'
            exit 1
          fi

      - name: Create one-resource ZIP
        shell: bash
        run: |
          set -euxo pipefail
          cd dist
          zip -r -9 mv_cinema_v1.5.8_audio_fix.zip mv_cinema -x '*/.DS_Store' '*.git*'
          unzip -t mv_cinema_v1.5.8_audio_fix.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mv_cinema_v1.5.8_audio_fix
          path: dist/mv_cinema_v1.5.8_audio_fix.zip
          if-no-files-found: error
          retention-days: 1
