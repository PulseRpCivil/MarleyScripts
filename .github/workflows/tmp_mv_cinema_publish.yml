name: Temporary mv_cinema archive publisher
on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Download validated build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf artifact release artifact.zip
          mkdir -p artifact release
          curl -L --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o artifact.zip \
            "https://api.github.com/repos/PulseRpCivil/MarleyScripts/actions/artifacts/8853465624/zip"
          unzip -t artifact.zip
          unzip -q artifact.zip -d artifact
          test -f artifact/mv_cinema_v1.5.8_audio_fix.zip
          cp artifact/mv_cinema_v1.5.8_audio_fix.zip release/mv_cinema_v1.5.8_audio_fix.zip
          unzip -t release/mv_cinema_v1.5.8_audio_fix.zip

      - name: Publish direct-download ZIP on branch
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/mv_cinema_v1.5.8_audio_fix.zip
          if git diff --cached --quiet; then
            echo 'Release archive already published'
            exit 0
          fi
          git commit -m 'Publish mv_cinema v1.5.8 archive [skip ci]'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
